services:
  app:
    build: .
    image: todo-app
    container_name: todo_app
    ports:
      - "8000:8000"
    volumes:
      # SQLite 파일이 들어있는 /data를 이름있는 볼륨에 연결 → 컨테이너 교체에도 데이터 유지
      - todo_data:/data
    environment:
      DATABASE_URL: sqlite:////data/todo.db
      # 호스트의 환경변수를 그대로 전달 (미설정이면 빈 값 → 앱이 임시 키 생성/가입 개방)
      JWT_SECRET: ${JWT_SECRET:-}
      REGISTER_CODE: ${REGISTER_CODE:-}
    restart: unless-stopped

volumes:
  todo_data:
