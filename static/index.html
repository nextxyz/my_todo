<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TODO</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    background: #f4f5f7;
    color: #222;
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px 64px;
  }
  h1 { font-size: 1.5rem; margin-bottom: 20px; }
  h2 { font-size: 1.05rem; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  section { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=text] { flex: 1; min-width: 200px; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
  input[type=date] { padding: 9px 10px; border: 1px solid #ccc; border-radius: 8px; font-size: .95rem; }
  button { padding: 10px 16px; border: none; border-radius: 8px; background: #3b82f6; color: #fff; font-size: .95rem; cursor: pointer; }
  button:hover { background: #2563eb; }
  ul { list-style: none; }
  li {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 4px; border-bottom: 1px solid #eee;
  }
  li:last-child { border-bottom: none; }
  li input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; accent-color: #3b82f6; }
  li.done .content { text-decoration: line-through; color: #999; }
  .content { flex: 0 1 auto; min-width: 0; }
  .row-spacer { flex: 1; }
  .date-tag { font-size: .78rem; color: #888; background: #f0f0f0; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
  .empty { color: #aaa; font-size: .9rem; padding: 8px 4px; }
  .menu-wrap { position: relative; }
  .menu-btn {
    background: none; color: #888; padding: 4px 8px; font-size: 1.1rem;
    line-height: 1; border-radius: 6px;
  }
  .menu-btn:hover { background: #f0f0f0; color: #333; }
  .menu {
    position: absolute; right: 0; top: 100%; z-index: 10;
    background: #fff; border: 1px solid #e2e2e2; border-radius: 8px;
    box-shadow: 0 4px 12px rgba(0,0,0,.12); padding: 4px; min-width: 110px;
  }
  .menu-item {
    display: block; width: 100%; text-align: left; background: none;
    color: #333; padding: 8px 10px; border-radius: 6px; font-size: .9rem;
  }
  .menu-item:hover { background: #f5f5f5; }
  .menu-item.danger { color: #ef4444; }
  .menu-item.danger:hover { background: #fef2f2; }
  .edit-input {
    flex: 1; padding: 6px 8px; border: 1px solid #3b82f6;
    border-radius: 6px; font-size: .95rem;
  }
  .edit-save, .edit-cancel {
    padding: 6px 12px; border: none; border-radius: 6px;
    font-size: .85rem; cursor: pointer;
  }
  .edit-save { background: #3b82f6; color: #fff; }
  .edit-save:hover { background: #2563eb; }
  .edit-cancel { background: #eee; color: #555; margin-left: 4px; }
  .edit-cancel:hover { background: #e0e0e0; }
  .badge { font-size: .75rem; background: #ef4444; color: #fff; border-radius: 10px; padding: 1px 8px; }
  .search-bar { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
  .search-notice { font-size: .8rem; color: #888; margin: 2px 0 8px; line-height: 1.5; }
  .search-bar #search-q { flex: 1; min-width: 140px; }
  .search-bar .tilde { color: #888; }
  /* 메모 아이콘: 메모 없으면 회색, 있으면 녹색 */
  .memo-btn { background: none; padding: 4px 6px; line-height: 0; border-radius: 6px; color: #bbb; }
  .memo-btn:hover { background: #f0f0f0; }
  .memo-btn.has-memo { color: #22c55e; }
  .memo-btn svg { fill: currentColor; display: block; }
  /* 메모 작성 모달 */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-overlay[hidden] { display: none; }
  .modal {
    background: #fff; border-radius: 12px; padding: 20px; width: 100%;
    max-width: 420px; box-shadow: 0 10px 40px rgba(0,0,0,.2);
  }
  .modal-title { font-weight: 600; margin-bottom: 12px; font-size: 1rem; word-break: break-all; }
  #memo-text {
    width: 100%; border: 1px solid #ccc; border-radius: 8px; padding: 10px;
    font-size: .95rem; font-family: inherit; resize: vertical;
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .btn-secondary { background: #eee; color: #555; }
  .btn-secondary:hover { background: #e0e0e0; }

  /* --- 로그인 / 회원가입 --- */
  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .topbar h1 { margin-bottom: 0; flex: 1; }
  #user-box { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: #666; }
  /* display를 지정하면 hidden 속성의 기본 display:none을 덮어쓰므로 따로 꺼준다 */
  #user-box[hidden] { display: none; }
  #user-box button { padding: 6px 12px; font-size: .8rem; }
  .auth-form { flex-direction: column; }
  .auth-form input {
    flex: 0 0 auto; width: 100%; min-width: 0;
    padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem;
  }
  .auth-form button { margin-top: 4px; }
  .auth-error { margin-top: 12px; padding: 10px 12px; background: #fee2e2; color: #b91c1c; border-radius: 8px; font-size: .88rem; }
  .auth-switch { margin-top: 14px; font-size: .88rem; color: #666; }
  .auth-switch a { color: #3b82f6; text-decoration: none; margin-left: 4px; }
  .auth-switch a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <header class="topbar">
    <h1>📝 나의 할 일</h1>
    <div id="user-box" hidden>
      <span id="user-email"></span>
      <button type="button" id="logout-btn" class="btn-secondary">로그아웃</button>
    </div>
  </header>

  <!-- 로그인 / 회원가입 (토큰이 없으면 이 화면만 보인다) -->
  <div id="auth-view" hidden>
    <section>
      <h2 id="auth-title">로그인</h2>
      <form id="auth-form" class="auth-form">
        <input type="email" id="auth-email" placeholder="이메일" autocomplete="username" required>
        <input type="password" id="auth-password" placeholder="비밀번호" autocomplete="current-password" required>
        <input type="text" id="auth-code" placeholder="초대 코드" autocomplete="off" hidden>
        <button type="submit" id="auth-submit">로그인</button>
      </form>
      <p id="auth-error" class="auth-error" hidden></p>
      <p class="auth-switch">
        <span id="auth-switch-text">계정이 없으신가요?</span><a href="#" id="auth-switch-link">회원가입</a>
      </p>
    </section>
  </div>

  <!-- 할 일 화면 (로그인 후에만 보인다) -->
  <div id="app-view" hidden>

  <!-- 할 일 등록 -->
  <section>
    <h2>할 일 추가</h2>
    <form id="add-form">
      <input type="text" id="add-content" placeholder="할 일을 입력하세요" required>
      <input type="date" id="add-date" title="비워두면 오늘 날짜로 등록됩니다">
      <button type="submit">추가</button>
    </form>
  </section>

  <!-- 오늘 할 일 -->
  <section>
    <h2>오늘 할 일 <span id="today-label" class="date-tag"></span></h2>
    <ul id="today-list"></ul>
  </section>

  <!-- 다가오는 할 일 (내일부터 7일, 오늘 미포함) -->
  <section>
    <h2>다가오는 할 일 <span id="upcoming-label" class="date-tag"></span></h2>
    <ul id="upcoming-list"></ul>
  </section>

  <!-- 지난 미완료 -->
  <section>
    <h2>밀린 할 일 <span id="overdue-badge" class="badge" hidden></span></h2>
    <ul id="overdue-list"></ul>
  </section>

  <!-- 할일 검색 -->
  <section>
    <h2>할일 검색</h2>
    <div class="search-bar">
      <input type="date" id="search-from" title="시작일">
      <span class="tilde">~</span>
      <input type="date" id="search-to" title="종료일">
      <input type="text" id="search-q" placeholder="검색어 (내용)">
      <button id="search-btn">검색</button>
    </div>
    <p id="search-notice" class="search-notice" hidden></p>
    <ul id="search-list"></ul>
  </section>

  <!-- 메모 작성 모달 -->
  <div id="memo-modal" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-title" id="memo-title">메모</div>
      <textarea id="memo-text" rows="6" placeholder="메모를 입력하세요"></textarea>
      <div class="modal-actions">
        <button type="button" id="memo-cancel" class="btn-secondary">취소</button>
        <button type="button" id="memo-save">저장</button>
      </div>
    </div>
  </div>
  </div>

<script>
const API = "/todos";
const TOKEN_KEY = "todo_access_token";

// JWT는 쿠키가 아닌 localStorage에 보관하고, 매 요청에 Bearer 헤더로 실어 보낸다.
const getToken = () => localStorage.getItem(TOKEN_KEY);
const setToken = (t) => localStorage.setItem(TOKEN_KEY, t);
const clearToken = () => localStorage.removeItem(TOKEN_KEY);

// 인증이 필요한 API 호출 래퍼.
// 401이면 토큰이 만료·무효라는 뜻이므로 버리고 로그인 화면으로 되돌린다.
async function api(path, options = {}) {
  const headers = { ...(options.headers || {}), Authorization: `Bearer ${getToken()}` };
  const res = await fetch(path, { ...options, headers });
  if (res.status === 401) {
    clearToken();
    showAuth("세션이 만료되었습니다. 다시 로그인해 주세요.");
    throw new Error("인증 만료");
  }
  return res;
}
const today = () => new Date().toLocaleDateString("sv-SE"); // YYYY-MM-DD (로컬 기준)

// isoDate(YYYY-MM-DD)에 n일을 더한 날짜 문자열 반환
function addDays(isoDate, n) {
  const d = new Date(isoDate + "T00:00:00");
  d.setDate(d.getDate() + n);
  return d.toLocaleDateString("sv-SE");
}

// isoDate에 n개월을 더한 날짜. 말일 보정: 5/31에서 -3개월이면 2/31이 되어
// 3/3으로 넘어가버리므로, 1일로 옮겼다가 그 달의 말일로 잘라준다.
function addMonths(isoDate, n) {
  const d = new Date(isoDate + "T00:00:00");
  const day = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + n);
  const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, lastDay));
  return d.toLocaleDateString("sv-SE");
}

// isoDate → "2026-07-16(목)" 형식 (요일 부가)
const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];
function withWeekday(isoDate) {
  const d = new Date(isoDate + "T00:00:00");
  return `${isoDate}(${WEEKDAYS[d.getDay()]})`;
}

// 정렬 비교 함수
const byContent = (a, b) => a.content.localeCompare(b.content, "ko");
const byDateThenContent = (a, b) =>
  a.date.localeCompare(b.date) || a.content.localeCompare(b.content, "ko");

async function fetchTodos(params = {}) {
  const qs = new URLSearchParams(params).toString();
  const res = await api(qs ? `${API}?${qs}` : API);
  if (!res.ok) throw new Error("조회 실패");
  return res.json();
}

async function addTodo(content, date) {
  const res = await api(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ content, date }),
  });
  if (!res.ok) throw new Error("등록 실패");
}

async function markDone(id) {
  const res = await api(`${API}/${id}/done`, { method: "PATCH" });
  if (!res.ok) throw new Error("완료 처리 실패");
}

async function markUndone(id) {
  const res = await api(`${API}/${id}/undone`, { method: "PATCH" });
  if (!res.ok) throw new Error("완료 취소 실패");
}

async function deleteTodo(id) {
  const res = await api(`${API}/${id}`, { method: "DELETE" });
  if (!res.ok) throw new Error("삭제 실패");
}

async function updateTodo(id, fields) {
  // fields: { content } 또는 { date } 또는 둘 다 (부분 수정)
  const res = await api(`${API}/${id}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(fields),
  });
  if (!res.ok) throw new Error("수정 실패");
}

function closeAllMenus() {
  document.querySelectorAll(".menu").forEach((m) => (m.hidden = true));
}

function renderList(el, items, { showDate = false, emptyMsg = "할 일이 없습니다" } = {}) {
  el.innerHTML = "";
  if (items.length === 0) {
    el.innerHTML = `<li class="empty">${emptyMsg}</li>`;
    return;
  }
  for (const t of items) {
    const li = document.createElement("li");
    if (t.done) li.classList.add("done");

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = t.done;
    cb.addEventListener("change", async () => {
      // 체크 시 완료 처리, 체크 해제 시 완료 취소
      if (cb.checked) {
        await markDone(t.id);
      } else {
        await markUndone(t.id);
      }
      refreshAll();
    });

    const span = document.createElement("span");
    span.className = "content";
    span.textContent = t.content;

    li.append(cb, span);

    // 메모 아이콘: 내용 바로 뒤에 위치. 메모 있으면 녹색, 없으면 회색
    const hasMemo = !!(t.memo && t.memo.trim());
    const memoBtn = document.createElement("button");
    memoBtn.type = "button";
    memoBtn.className = "memo-btn" + (hasMemo ? " has-memo" : "");
    memoBtn.setAttribute("aria-label", "메모");
    memoBtn.title = hasMemo ? "메모 보기/수정" : "메모 추가";
    memoBtn.innerHTML =
      '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm2 6v2h8V9H7zm0 4v2h8v-2H7zm0 4v2h5v-2H7z"/></svg>';
    memoBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      openMemo(t);
    });
    li.append(memoBtn);

    // 스페이서: 날짜·메뉴를 오른쪽으로 밀어냄
    const spacer = document.createElement("span");
    spacer.className = "row-spacer";
    li.append(spacer);

    if (showDate) {
      const tag = document.createElement("span");
      tag.className = "date-tag";
      tag.textContent = withWeekday(t.date);
      li.append(tag);
    }

    // ⋯ 메뉴: 클릭 시 삭제 옵션 표시 (완료/미완료 항목 모두)
    const menuWrap = document.createElement("div");
    menuWrap.className = "menu-wrap";

    const menuBtn = document.createElement("button");
    menuBtn.type = "button";
    menuBtn.className = "menu-btn";
    menuBtn.textContent = "⋯";
    menuBtn.setAttribute("aria-label", "더보기");

    const menu = document.createElement("div");
    menu.className = "menu";
    menu.hidden = true;

    // 할일 수정: 클릭 시 내용을 인라인 편집 모드로 전환
    const editBtn = document.createElement("button");
    editBtn.type = "button";
    editBtn.className = "menu-item";
    editBtn.textContent = "✏ 할일 수정";
    editBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      closeAllMenus();

      const input = document.createElement("input");
      input.type = "text";
      input.className = "edit-input";
      input.value = t.content;

      const save = document.createElement("button");
      save.type = "button";
      save.className = "edit-save";
      save.textContent = "수정";

      const cancel = document.createElement("button");
      cancel.type = "button";
      cancel.className = "edit-cancel";
      cancel.textContent = "취소";

      const doSave = async () => {
        const v = input.value.trim();
        if (!v) { input.focus(); return; } // 빈 내용은 저장 안 함
        await updateTodo(t.id, { content: v });
        refreshAll();
      };
      save.addEventListener("click", doSave);
      cancel.addEventListener("click", refreshAll);
      input.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") doSave();
        else if (ev.key === "Escape") refreshAll();
      });

      // content 텍스트 → 입력창으로, ⋯메뉴 → 수정/취소 버튼으로 교체
      span.replaceWith(input);
      menuWrap.replaceWith(save, cancel);
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length); // 커서를 끝으로
    });

    // 날짜 수정: 클릭 시 달력(date input)으로 전환, 날짜를 고르면 즉시 저장
    const dateBtn = document.createElement("button");
    dateBtn.type = "button";
    dateBtn.className = "menu-item";
    dateBtn.textContent = "📅 날짜 수정";
    dateBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      closeAllMenus();

      const input = document.createElement("input");
      input.type = "date";
      input.className = "edit-input";
      input.value = t.date;

      const cancel = document.createElement("button");
      cancel.type = "button";
      cancel.className = "edit-cancel";
      cancel.textContent = "취소";
      cancel.addEventListener("click", refreshAll);

      // 달력에서 날짜를 선택하면 바로 수정 적용
      input.addEventListener("change", async () => {
        if (!input.value) return;
        await updateTodo(t.id, { date: input.value });
        refreshAll();
      });
      input.addEventListener("keydown", (ev) => {
        if (ev.key === "Escape") refreshAll();
      });

      span.replaceWith(input);
      menuWrap.replaceWith(cancel);
      input.focus();
      try { input.showPicker(); } catch (_) {} // 지원 브라우저면 달력 바로 열기
    });

    const delBtn = document.createElement("button");
    delBtn.type = "button";
    delBtn.className = "menu-item danger";
    delBtn.textContent = "🗑 삭제";
    delBtn.addEventListener("click", async (e) => {
      e.stopPropagation();
      await deleteTodo(t.id);
      refreshAll();
    });
    menu.append(editBtn, dateBtn, delBtn);

    menuBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const willOpen = menu.hidden;
      closeAllMenus(); // 다른 항목 메뉴는 닫고
      menu.hidden = !willOpen;
    });

    menuWrap.append(menuBtn, menu);
    li.append(menuWrap);
    el.append(li);
  }
}

async function refreshToday() {
  document.getElementById("today-label").textContent = withWeekday(today());
  const items = await fetchTodos({ date: today() });
  items.sort(byContent); // 할 일 내용 오름차순
  renderList(document.getElementById("today-list"), items, { emptyMsg: "오늘 할 일이 없습니다 🎉" });
}

async function refreshUpcoming() {
  // 내일(오늘+1)부터 7일 뒤(오늘+7)까지, 양끝 포함. 기간 조회 엔드포인트 사용.
  const start = addDays(today(), 1);
  const end = addDays(today(), 7);
  document.getElementById("upcoming-label").textContent = `${withWeekday(start)} ~ ${withWeekday(end)}`;
  const items = await fetchTodos({ start, end });
  items.sort(byDateThenContent); // 날짜 오름차순 → 같은 날짜는 내용 오름차순
  renderList(document.getElementById("upcoming-list"), items, {
    showDate: true,
    emptyMsg: "다가오는 7일간 할 일이 없습니다",
  });
}

async function refreshOverdue() {
  // 미완료 전체를 받아서 오늘 이전 날짜만 필터
  const items = (await fetchTodos({ done: false })).filter(t => t.date < today());
  items.sort(byDateThenContent); // 과거 날짜 오름차순 → 같은 날짜는 내용 오름차순
  const badge = document.getElementById("overdue-badge");
  badge.hidden = items.length === 0;
  badge.textContent = items.length;
  renderList(document.getElementById("overdue-list"), items, { showDate: true, emptyMsg: "밀린 할 일이 없습니다 👍" });
}

let searchPerformed = false; // 한 번이라도 검색했으면 refreshAll 때 재실행

// 기간을 지정하지 않고 검색할 때 훑을 과거 범위(개월).
// 전 기간을 훑으면 데이터가 쌓일수록 느려지므로 안전장치를 둔다.
const DEFAULT_SEARCH_MONTHS = 3;

async function doSearch() {
  const from = document.getElementById("search-from").value;
  const to = document.getElementById("search-to").value;
  const q = document.getElementById("search-q").value.trim();

  // 규칙: from+to → 기간 / 하나만 → 그 하루 / 둘 다 없음 → 최근 3개월(과거만 제한)
  const params = {};
  let notice = "";
  if (from && to) { params.start = from; params.end = to; }
  else if (from) { params.start = from; params.end = from; }
  else if (to) { params.start = to; params.end = to; }
  else {
    // 끝(end)을 열어두는 이유: 앞으로 예정된 할 일도 검색되어야 하기 때문.
    // 데이터가 누적되는 쪽은 과거이므로 시작만 막아도 목적은 달성된다.
    params.start = addMonths(today(), -DEFAULT_SEARCH_MONTHS);
    notice = `기간 미지정 → ${withWeekday(params.start)}부터 검색했습니다 ` +
             `(최근 ${DEFAULT_SEARCH_MONTHS}개월 + 예정된 할 일). ` +
             `더 이전을 보려면 시작일을 지정하세요.`;
  }
  if (q) params.q = q; // 검색어 없으면 기간만

  const noticeEl = document.getElementById("search-notice");
  noticeEl.textContent = notice;
  noticeEl.hidden = !notice;

  const items = await fetchTodos(params);
  items.sort(byDateThenContent); // 날짜 → 내용 순
  renderList(document.getElementById("search-list"), items, { showDate: true, emptyMsg: "검색 결과가 없습니다" });
}

async function refreshSearch() {
  if (searchPerformed) await doSearch(); // 검색한 적 있을 때만 갱신
}

function refreshAll() {
  refreshToday();
  refreshUpcoming();
  refreshOverdue();
  refreshSearch();
}

document.getElementById("add-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const content = document.getElementById("add-content").value.trim();
  if (!content) return;
  const date = document.getElementById("add-date").value || today(); // 미지정 시 오늘
  await addTodo(content, date);
  document.getElementById("add-content").value = "";
  document.getElementById("add-date").value = "";
  refreshAll();
});

document.getElementById("search-btn").addEventListener("click", () => {
  searchPerformed = true;
  doSearch();
});
// 검색어 입력창에서 Enter로도 검색
document.getElementById("search-q").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { searchPerformed = true; doSearch(); }
});

// 메뉴 바깥을 클릭하면 열린 메뉴 닫기
document.addEventListener("click", closeAllMenus);

// --- 메모 모달 ---
let memoTargetId = null;
const memoModal = document.getElementById("memo-modal");

function openMemo(t) {
  memoTargetId = t.id;
  document.getElementById("memo-title").textContent = `메모 — ${t.content}`;
  document.getElementById("memo-text").value = t.memo || "";
  memoModal.hidden = false;
  document.getElementById("memo-text").focus();
}

function closeMemo() {
  memoModal.hidden = true;
  memoTargetId = null;
}

async function saveMemo() {
  if (memoTargetId == null) return;
  const memo = document.getElementById("memo-text").value;
  await updateTodo(memoTargetId, { memo }); // 빈 문자열이면 메모 삭제
  closeMemo();
  refreshAll();
}

document.getElementById("memo-save").addEventListener("click", saveMemo);
document.getElementById("memo-cancel").addEventListener("click", closeMemo);
memoModal.addEventListener("click", (e) => {
  if (e.target === memoModal) closeMemo(); // 오버레이(바깥) 클릭 시 닫기
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !memoModal.hidden) closeMemo();
});

// --- 로그인 / 회원가입 ---
const authView = document.getElementById("auth-view");
const appView = document.getElementById("app-view");
const userBox = document.getElementById("user-box");
const authError = document.getElementById("auth-error");

let authMode = "login";           // "login" | "register"
let registerCodeRequired = false; // 서버가 초대 코드를 요구하는지

function setAuthError(msg) {
  authError.textContent = msg || "";
  authError.hidden = !msg;
}

function showAuth(msg) {
  authView.hidden = false;
  appView.hidden = true;
  userBox.hidden = true;
  setAuthError(msg);
}

function showApp(email) {
  authView.hidden = true;
  appView.hidden = false;
  userBox.hidden = false;
  document.getElementById("user-email").textContent = email;
  setAuthError("");
  refreshAll();
}

function setAuthMode(mode) {
  authMode = mode;
  const isLogin = mode === "login";
  document.getElementById("auth-title").textContent = isLogin ? "로그인" : "회원가입";
  document.getElementById("auth-submit").textContent = isLogin ? "로그인" : "가입하기";
  document.getElementById("auth-switch-text").textContent =
    isLogin ? "계정이 없으신가요?" : "이미 계정이 있으신가요?";
  document.getElementById("auth-switch-link").textContent = isLogin ? "회원가입" : "로그인";
  document.getElementById("auth-password").autocomplete = isLogin ? "current-password" : "new-password";
  // 초대 코드는 회원가입에서만, 그리고 서버가 요구할 때만 노출
  document.getElementById("auth-code").hidden = isLogin || !registerCodeRequired;
  setAuthError("");
}

// 서버의 detail은 문자열(HTTPException) 또는 배열(pydantic 검증 오류)로 온다
function errorDetail(body, fallback) {
  const d = body && body.detail;
  if (typeof d === "string") return d;
  if (Array.isArray(d) && d.length) return d[0].msg || fallback;
  return fallback;
}

async function doLogin(email, password) {
  // fastapi-users의 로그인은 OAuth2 password flow — form 인코딩이고 필드명이 username이다
  const res = await fetch("/auth/jwt/login", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ username: email, password }),
  });
  if (!res.ok) {
    setAuthError(res.status === 400 ? "이메일 또는 비밀번호가 올바르지 않습니다" : "로그인 실패");
    return;
  }
  setToken((await res.json()).access_token);
  showApp(email);
}

async function doRegister(email, password, code) {
  const res = await fetch("/auth/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password, code: code || null }),
  });
  if (!res.ok) {
    setAuthError(errorDetail(await res.json().catch(() => null), "회원가입 실패"));
    return;
  }
  await doLogin(email, password); // 가입 성공 → 곧바로 로그인
}

document.getElementById("auth-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;
  const code = document.getElementById("auth-code").value.trim();
  if (authMode === "login") await doLogin(email, password);
  else await doRegister(email, password, code);
});

document.getElementById("auth-switch-link").addEventListener("click", (e) => {
  e.preventDefault();
  setAuthMode(authMode === "login" ? "register" : "login");
});

document.getElementById("logout-btn").addEventListener("click", () => {
  // 서버는 세션 상태를 두지 않으므로(stateless JWT) 토큰만 버리면 로그아웃이다
  clearToken();
  location.reload();
});

async function init() {
  // 초대 코드 입력란을 띄울지 서버에 물어본다 (코드 값 자체는 내려오지 않는다)
  registerCodeRequired = await fetch("/auth/config")
    .then((r) => r.json())
    .then((c) => c.register_code_required)
    .catch(() => false);
  setAuthMode("login");

  if (!getToken()) {
    showAuth();
    return;
  }
  // 저장된 토큰이 아직 유효한지 확인하면서 사용자 이메일을 가져온다
  const res = await fetch("/users/me", {
    headers: { Authorization: `Bearer ${getToken()}` },
  });
  if (!res.ok) {
    clearToken();
    showAuth();
    return;
  }
  showApp((await res.json()).email);
}

init();
</script>
